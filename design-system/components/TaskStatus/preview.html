<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>TaskStatus</title>
<style>.row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-5)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var B = window.BuildOS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'row' }, h(B.TaskStatus, { status: 'todo' }), h(B.TaskStatus, { status: 'done' }), h(B.TaskStatus, { status: 'postponed' })));
</script>
</body>
</html>
