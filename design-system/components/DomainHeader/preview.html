<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>DomainHeader</title>
<style>.wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:var(--space-7);padding:var(--space-6) var(--space-5)}.col{display:flex;flex-direction:column;gap:var(--space-6)}</style>
</head>
<body>
<div id="root"></div>
<script>
  var B = window.BuildOS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'wrap' },
      h('div', { className: 'col' },
        h(B.DomainHeader, { index: '03', name: 'Juridique & admin', icon: 'scale', done: 2, total: 4, forgotten: 3 }),
        h(B.DomainHeader, { index: '04', name: 'Finance', icon: 'euro', done: 2, total: 4, forgotten: 1 })),
      h('div', { className: 'col' },
        h(B.DomainHeader, { index: '01', name: 'Produit', icon: 'cube', done: 2, total: 4, forgotten: 1, compact: true }))));
</script>
</body>
</html>
