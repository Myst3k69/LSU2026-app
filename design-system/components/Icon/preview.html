<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Icon</title>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:var(--space-2);padding:var(--space-5)}.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--space-3) 4px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);color:var(--ink)}.cell span{color:var(--ink-3);font-size:11px}</style>
</head>
<body>
<div id="root"></div>
<script>
  var B = window.BuildOS, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'grid' }, B.icons.map(function (n) { return h('div', { key: n, className: 'cell' }, h(B.Icon, { name: n, size: 22 }), h('span', null, n)); })));
</script>
</body>
</html>
