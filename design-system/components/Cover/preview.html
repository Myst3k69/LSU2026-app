<!-- @dsCard height=288 -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>BuildOS</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .bleu { fill: var(--bleu); }
  .deep { fill: var(--ink); }
  .tint { fill: var(--bleu-soft); }
  .signal { fill: var(--orange); }
  .blk { rx: var(--radius-md); }
  .chip { rx: var(--radius-xs); }
  .num { fill: var(--paper); font-family: var(--font-serif); font-weight: 600; font-size: 176px; letter-spacing: -0.04em; }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .92; font-weight: 800; letter-spacing: -0.045em; color: var(--ink); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      ink slab 192×248 bleeding off the bottom (the editorial ink) · bleu disc r128 bleeding off the top-right edge (the identity colour, the largest field) · bleu-soft 112×104 (relief, the copilot tint) · orange 24×24 once (it only ever means "souvent oubliée") — about 40% of 960×288
  arrangement one tall ink slab with a bleu disc and two satellites, all touching the top or bottom edge like the cut discs of the mockup
  pattern     one oversized serif numeral "08" cut out of the slab in paper, from the README's numbered sections (Newsreader numerals, "08 domaines")
  scales      slab x space-4, top space-7+space-2, gutters space-4; corners radius-md, signal radius-xs, disc radius-full
-->
<defs><clipPath id="slab"><rect x="16" y="56" width="192" height="248" rx="12"/></clipPath></defs>
<rect class="deep blk" x="16" y="56" width="192" height="248" rx="12"/>
<text class="num" x="22" y="296" clip-path="url(#slab)">08</text>
<circle class="bleu" cx="416" cy="80" r="128"/>
<rect class="tint blk" x="224" y="200" width="112" height="104" rx="12"/>
<rect class="signal chip" x="224" y="160" width="24" height="24" rx="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">BuildOS</h1>
<p class="tag">De l’idée au plan d’action, domaine par domaine.</p>
</div>
</div>
</body>
</html>
